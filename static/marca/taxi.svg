<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Tax-i">
  <!-- La casilla del formulario, verificada. El visto está en el lugar del
       segundo ojo: la misma marca de "revisado" hace que la casilla guiñe.
       La esquina doblada es la hoja de papel, y de paso la gorra ladeada.
       Un solo trazo con fill-rule="evenodd": el ojo y el visto son huecos,
       así que la marca funciona en un solo color sobre cualquier fondo. -->
  <path fill="#10805F" fill-rule="evenodd" d="M6 3h13.5L29 12.5V26a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Zm3.2 9.9v5.2h4.4v-5.2H9.2Zm8.4 2.7-1.9 1.9 3.8 3.8 6-6.7-1.9-1.7-4.1 4.6-1.9-1.9Z"/>
  <path fill="#0A5A40" d="M19.5 3 29 12.5h-6.5a3 3 0 0 1-3-3V3Z"/>
</svg>
